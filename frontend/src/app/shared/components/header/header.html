<nav class="navbar navbar-expand-md bg-white">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/" (click)="cerrarMenu()">
      <img src="logo.png" alt="" class="header-logo" />
      <span class="header-marca">JAC CONNECT</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Abrir menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAbierto()">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="cerrarMenu()"
          >
            Inicio
          </a>
        </li>

        <!-- Solo se muestra con sesión iniciada -->
        @if (auth.usuario(); as usuario) {
          <!-- Gestión de juntas: solo el administrador -->
          @if (auth.esAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/juntas" routerLinkActive="active" (click)="cerrarMenu()">
                Juntas
              </a>
            </li>
          } @else {
            <!-- Módulos de la junta: directivos y ciudadanos -->
            <li class="nav-item">
              <a class="nav-link" routerLink="/reuniones" routerLinkActive="active" (click)="cerrarMenu()">
                Reuniones
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/avisos"
                routerLinkActive="active"
                (click)="cerrarMenu()"
                [attr.aria-label]="'Avisos, ' + avisos.noLeidos() + ' sin leer'"
              >
                <i class="bi bi-bell me-1"></i>Avisos
                @if (avisos.noLeidos() > 0) {
                  <span class="badge rounded-pill text-bg-danger">{{ avisos.noLeidos() }}</span>
                }
              </a>
            </li>
          }
          <li class="nav-item">
            <span class="navbar-text">
              <i class="bi bi-person-circle me-1"></i>{{ usuario.nombre }}
            </span>
          </li>
          <li class="nav-item mt-2 mt-md-0">
            <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-3" (click)="cerrarSesion()">
              <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
