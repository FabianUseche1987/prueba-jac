<form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
  <!-- La sesión terminó sola (venció o no es válida) -->
  @if (auth.avisoSesion()) {
    <div class="alert alert-warning py-2 small" role="alert">
      <i class="bi bi-clock-history me-1"></i>{{ auth.avisoSesion() }}
    </div>
  }

  <div class="mb-3">
    <label for="correo" class="form-label">Correo electrónico</label>
    <input
      id="correo"
      type="email"
      class="form-control"
      formControlName="correo"
      autocomplete="username"
      [class.is-invalid]="form.controls.correo.invalid && form.controls.correo.touched"
    />
    <div class="invalid-feedback">
      @if (form.controls.correo.hasError('required')) {
        Ingresa tu correo
      } @else {
        Escribe un correo válido
      }
    </div>
  </div>

  <div class="mb-2">
    <label for="contrasena" class="form-label">Contraseña</label>
    <div class="input-group has-validation">
      <input
        id="contrasena"
        [type]="verContrasena ? 'text' : 'password'"
        class="form-control"
        formControlName="contrasena"
        autocomplete="current-password"
        [class.is-invalid]="form.controls.contrasena.invalid && form.controls.contrasena.touched"
      />
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="verContrasena = !verContrasena"
        [attr.aria-label]="verContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        <i class="bi" [class.bi-eye]="!verContrasena" [class.bi-eye-slash]="verContrasena"></i>
      </button>
      <div class="invalid-feedback">Ingresa tu contraseña</div>
    </div>
  </div>

  <div class="text-end mb-3">
    <a routerLink="/recuperar-contrasena" class="login-form-link small">¿Olvidaste tu contraseña?</a>
  </div>

  <!-- Mensaje de la API: correo o contraseña incorrectos, cuenta inactiva, sin conexión... -->
  @if (errorLogin) {
    <div class="alert alert-danger py-2 small" role="alert">
      <i class="bi bi-exclamation-circle me-1"></i>{{ errorLogin }}
    </div>
  }

  <button type="submit" class="btn btn-jac rounded-pill w-100" [disabled]="ingresando">
    @if (ingresando) {
      <span class="spinner-border spinner-border-sm me-1"></span>Ingresando…
    } @else {
      Ingresar
    }
  </button>
</form>
